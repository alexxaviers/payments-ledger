groups:
  - name: ledger
    rules:
      - alert: LedgerReconciliationMismatch
        expr: max(ledger_reconciliation_mismatches) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: The ledger does not reconcile
          description: >-
            The last reconciliation found {{ $value }} problem(s): balances that disagree with entries,
            entries that do not sum to 0, malformed transactions, or overdue outbox events. Check the
            ledger-service logs for "RECONCILIATION FAILED".

      - alert: LedgerOutboxBacklogHigh
        expr: max(ledger_outbox_backlog) > 1000 or max(ledger_outbox_oldest_unpublished_seconds) > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Outbox events are not reaching Kafka
          description: >-
            Unpublished events are piling up (backlog or age too high). Kafka may be down or the
            publisher may be failing; transfers still succeed but downstream consumers are delayed.

      - alert: LedgerHighErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{application="ledger-service",status=~"5.."}[5m]))
          / clamp_min(sum(rate(http_server_requests_seconds_count{application="ledger-service"}[5m])), 1e-9) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than 1% of ledger requests fail with 5xx
