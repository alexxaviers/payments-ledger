# kind create cluster --name ledger --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # ledger-service NodePort -> localhost:8080
        hostPort: 8080
      - containerPort: 30081   # notifications-service NodePort -> localhost:8081
        hostPort: 8081
      - containerPort: 30300   # Grafana NodePort (when monitoring is installed) -> localhost:3000
        hostPort: 3000
