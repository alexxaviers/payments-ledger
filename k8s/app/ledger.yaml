apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: ledger
  labels:
    app: ledger
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ledger
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ledger
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: ledger
          image: payments-ledger/ledger-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ledger-config
            - secretRef:
                name: ledger-secrets
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          # Startup can take a while (JVM + Flyway); liveness only kicks in once startup succeeded.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # give kube-proxy time to stop routing new requests here before shutdown starts
              sleep:
                seconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: ledger
  labels:
    app: ledger
spec:
  type: NodePort
  selector:
    app: ledger
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
