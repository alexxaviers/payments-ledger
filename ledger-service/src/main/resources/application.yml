spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 10000
        request.timeout.ms: 10000
        delivery.timeout.ms: 15000
  task:
    scheduling:
      pool:
        size: 2

ledger:
  outbox:
    topic: ledger.transfers
    partitions: 3
    publisher:
      enabled: true
      interval: 200ms
      batch-size: 100
  reconciliation:
    enabled: true
    initial-delay: 10s
    interval: 30s
    max-outbox-lag: 60s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
